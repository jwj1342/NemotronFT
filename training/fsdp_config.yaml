compute_environment: LOCAL_MACHINE
distributed_type: FSDP
fsdp_config:
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
  fsdp_backward_prefetch: NO_PREFETCH       # was BACKWARD_PRE; double-gather (2× per-layer MoE = 5 GB) exceeded L40s headroom on Nemotron-H
  fsdp_cpu_ram_efficient_loading: true   # load shards to CPU first, avoids OOM
  fsdp_forward_prefetch: false
  fsdp_offload_params: false
  fsdp_sharding_strategy: FULL_SHARD    # every rank holds 1/N of params
  fsdp_state_dict_type: FULL_STATE_DICT
  fsdp_sync_module_states: true
  fsdp_use_orig_params: true            # required for PEFT/LoRA target_modules matching
  fsdp_activation_checkpointing: false  # disabled: metadata mismatch with torch 2.5.1 FSDP+LoRA
machine_rank: 0
main_training_function: main
num_machines: 1
num_processes: 4
